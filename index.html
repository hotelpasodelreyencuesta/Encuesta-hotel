<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Opinión - Hotel Paso del Rey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f7;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #666;
      margin-bottom: 28px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 24px;
      line-height: 1.2;
      text-align: center;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 16px;
      margin: 0 0 22px;
    }

    .rating-button {
      width: 100%;
      min-height: 70px;
      border: 0;
      border-radius: 18px;
      margin-bottom: 14px;
      padding: 12px 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .happy {
      background: #dff4e5;
      color: #176b32;
    }

    .medium {
      background: #fff2c7;
      color: #765900;
    }

    .sad {
      background: #f9dddd;
      color: #9a2525;
    }

    .reason-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }

    .reason-button {
      min-height: 60px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 15px;
      padding: 8px 5px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
    }

    .reason-button.selected {
      border-color: #222;
      background: #eeeeee;
    }

    .continue-button,
    .send-button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 15px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue-button:disabled,
    .send-button:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 2px solid #ddd;
      border-radius: 15px;
      padding: 15px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      margin-bottom: 18px;
      background: white;
    }

    textarea:focus {
      outline: none;
      border-color: #555;
    }

    .thanks {
      text-align: center;
    }

    .thanks-icon {
      font-size: 52px;
      margin-bottom: 18px;
    }

    .thanks h1 {
      margin-bottom: 12px;
    }

    .error {
      color: #b00020;
      text-align: center;
      font-size: 15px;
      margin-top: 15px;
      display: none;
    }

    .hidden-form {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">HOTEL PASO DEL REY</div>

    <section id="screen1" class="screen active">

      <h1>¿Cómo fue tu estadía?</h1>

      <p class="subtitle">
        Nos lleva solo unos segundos.
      </p>

      <button
        class="rating-button happy"
        onclick="seleccionarEvaluacion('CONTENTO')">
        🟢 CONTENTO
      </button>

      <button
        class="rating-button medium"
        onclick="seleccionarEvaluacion('MAS O MENOS')">
        🟡 MÁS O MENOS
      </button>

      <button
        class="rating-button sad"
        onclick="seleccionarEvaluacion('DESILUSIONADO')">
        🔴 DESILUSIONADO
      </button>

    </section>


    <section id="screen2" class="screen">

      <h1 id="preguntaMotivos"></h1>

      <p class="subtitle">
        Podés elegir más de uno.
      </p>

      <div class="reason-grid">

        <button class="reason-button" data-reason="Limpieza">
          🧹 Limpieza
        </button>

        <button class="reason-button" data-reason="Cama">
          🛏️ Cama
        </button>

        <button class="reason-button" data-reason="Baño">
          🚿 Baño
        </button>

        <button class="reason-button" data-reason="TV">
          📺 TV
        </button>

        <button class="reason-button" data-reason="Ruido">
          🔇 Ruido
        </button>

        <button class="reason-button" data-reason="Mantenimiento">
          🛠️ Mantenimiento
        </button>

        <button class="reason-button" data-reason="Climatización">
          🌡️ Climatización
        </button>

        <button class="reason-button" data-reason="Atención">
          👤 Atención
        </button>

        <button class="reason-button" data-reason="Precio">
          💰 Precio
        </button>

        <button class="reason-button" data-reason="Privacidad">
          🔒 Privacidad
        </button>

        <button class="reason-button" data-reason="Otro">
          • Otro
        </button>

      </div>

      <button
        id="continueButton"
        class="continue-button"
        onclick="irAComentario()"
        disabled>
        CONTINUAR
      </button>

    </section>


    <section id="screen3" class="screen">

      <h1>¿Querés contarnos algo más?</h1>

      <p class="subtitle">
        Opcional.
      </p>

      <textarea
        id="comentario"
        maxlength="500"
        placeholder="Tu comentario..."></textarea>

      <button
        id="sendButton"
        class="send-button"
        onclick="enviarRespuesta()">
        ENVIAR
      </button>

      <div id="errorMessage" class="error"></div>

    </section>


    <section id="screen4" class="screen">

      <div class="thanks">

        <div class="thanks-icon">
          ✓
        </div>

        <h1>
          ¡Gracias por tu opinión!
        </h1>

        <p class="subtitle">
          Nos ayuda a seguir mejorando.
        </p>

      </div>

    </section>

  </div>


  <iframe
    name="respuestaFrame"
    id="respuestaFrame"
    style="display:none;">
  </iframe>


  <form
    id="formularioRespuesta"
    class="hidden-form"
    method="POST"
    target="respuestaFrame"
    onsubmit="prepararEnvio()">

    <input
      type="hidden"
      name="habitacion"
      id="campoHabitacion">

    <input
      type="hidden"
      name="evaluacion"
      id="campoEvaluacion">

    <input
      type="hidden"
      name="motivos"
      id="campoMotivos">

    <input
      type="hidden"
      name="comentario"
      id="campoComentario">

  </form>


  <script>

    const URL_SERVIDOR =
      'https://script.google.com/macros/s/AKfycbz-i-BJ2oNiwlEvPWmwqfrMTDU1Xhx5J9RWZU8hUyy5U3hYQcvUFAe6R58oLiYCJ3-tvw/exec';

    const parametros =
      new URLSearchParams(window.location.search);

    const HABITACION =
      parametros.get('habitacion') || '';

    let evaluacionSeleccionada = '';

    let motivosSeleccionados = [];

    let enviando = false;


    document.getElementById('formularioRespuesta').action =
      URL_SERVIDOR;

    document.getElementById('campoHabitacion').value =
      HABITACION;


    function mostrarPantalla(numero) {

      document.querySelectorAll('.screen').forEach(function(screen) {
        screen.classList.remove('active');
      });

      document
        .getElementById('screen' + numero)
        .classList.add('active');

      window.scrollTo(0, 0);
    }


    function seleccionarEvaluacion(evaluacion) {

      evaluacionSeleccionada = evaluacion;

      const pregunta =
        document.getElementById('preguntaMotivos');

      if (evaluacion === 'CONTENTO') {

        pregunta.textContent =
          '¿Qué fue lo que más te gustó?';

      } else if (evaluacion === 'MAS O MENOS') {

        pregunta.textContent =
          '¿Qué podríamos mejorar?';

      } else if (evaluacion === 'DESILUSIONADO') {

        pregunta.textContent =
          '¿Qué fue lo que no te gustó?';
      }

      mostrarPantalla(2);
    }


    document
      .querySelectorAll('.reason-button')
      .forEach(function(button) {

        button.addEventListener('click', function() {

          const motivo = this.dataset.reason;

          if (motivosSeleccionados.includes(motivo)) {

            motivosSeleccionados =
              motivosSeleccionados.filter(function(item) {
                return item !== motivo;
              });

            this.classList.remove('selected');

          } else {

            motivosSeleccionados.push(motivo);

            this.classList.add('selected');
          }


          document
            .getElementById('continueButton')
            .disabled =
              motivosSeleccionados.length === 0;

        });

      });


    function irAComentario() {

      if (motivosSeleccionados.length === 0) {
        return;
      }

      mostrarPantalla(3);
    }


    function prepararEnvio() {

      document.getElementById('campoHabitacion').value =
        HABITACION;

      document.getElementById('campoEvaluacion').value =
        evaluacionSeleccionada;

      document.getElementById('campoMotivos').value =
        JSON.stringify(motivosSeleccionados);

      document.getElementById('campoComentario').value =
        document.getElementById('comentario').value.trim();
    }


    function enviarRespuesta() {

      if (enviando) {
        return;
      }

      const errorMessage =
        document.getElementById('errorMessage');

      const sendButton =
        document.getElementById('sendButton');


      if (!HABITACION) {

        errorMessage.textContent =
          'No se pudo identificar la habitación.';

        errorMessage.style.display = 'block';

        return;
      }


      if (!evaluacionSeleccionada) {

        errorMessage.textContent =
          'No se pudo identificar la evaluación.';

        errorMessage.style.display = 'block';

        return;
      }


      if (motivosSeleccionados.length === 0) {

        errorMessage.textContent =
          'Seleccioná al menos un motivo.';

        errorMessage.style.display = 'block';

        return;
      }


      enviando = true;

      sendButton.disabled = true;

      sendButton.textContent = 'ENVIANDO...';

      errorMessage.style.display = 'none';


      prepararEnvio();

      document
        .getElementById('formularioRespuesta')
        .submit();


      setTimeout(function() {

        mostrarPantalla(4);

      }, 1200);

    }

  </script>

</body>
</html>
